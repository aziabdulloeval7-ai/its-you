<!DOCTYPE html> 
<html lang="ru">
 <head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Гап зан 🤖</title> 
<style> * { margin: 0; padding: 0; box-sizing: border-box; } 
body { min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif; background: linear-gradient(135deg, #15152e, #302060, #111827); overflow: hidden; color: white; } .stars { position: absolute; width: 100%; height: 100%; background-image: radial-gradient(white 1px, transparent 1px), radial-gradient(white 1px, transparent 1px); background-size: 60px 60px, 90px 90px; animation: stars 8s linear infinite; opacity: 0.35; } @keyframes stars { from { transform: translateY(0); } to { transform: translateY(60px); } } .container { position: relative; z-index: 2; text-align: center; } h1 { font-size: 48px; margin-bottom: 10px; text-shadow: 0 0 20px #8b5cf6; } .subtitle { font-size: 18px; opacity: 0.8; margin-bottom: 40px; } .robot { width: 180px; height: 220px; margin: auto; position: relative; animation: dance 0.8s infinite alternate ease-in-out; } /* Голова */ .head { width: 120px; height: 90px; background: #d1d5db; border-radius: 25px; border: 5px solid #6b7280; position: absolute; left: 30px; top: 0; } /* Глаза */ .eye { width: 18px; height: 18px; background: #22d3ee; border-radius: 50%; position: absolute; top: 30px; box-shadow: 0 0 15px #22d3ee; } .eye.left { left: 25px; } .eye.right { right: 25px; } /* Тело */ .body { width: 110px; height: 100px; background: #9ca3af; border: 5px solid #6b7280; border-radius: 20px; position: absolute; left: 35px; top: 100px; } /* Руки */ .arm { width: 25px; height: 90px; background: #d1d5db; border: 5px solid #6b7280; border-radius: 20px; position: absolute; top: 105px; } .arm.left { left: 5px; transform-origin: top center; animation: leftArm 0.4s infinite alternate; } .arm.right { right: 5px; transform-origin: top center; animation: rightArm 0.4s infinite alternate; } /* Ноги */ .leg { width: 30px; height: 65px; background: #d1d5db; border: 5px solid #6b7280; border-radius: 15px; position: absolute; top: 190px; } .leg.left { left: 55px; animation: leftLeg 0.4s infinite alternate; } .leg.right { right: 55px; animation: rightLeg 0.4s infinite alternate; } /* Танец */ @keyframes dance { from { transform: rotate(-5deg) translateY(0); } to { transform: rotate(5deg) translateY(-15px); } } @keyframes leftArm { from { transform: rotate(35deg); } to { transform: rotate(-35deg); } } @keyframes rightArm { from { transform: rotate(-35deg); } to { transform: rotate(35deg); } } @keyframes leftLeg { from { transform: rotate(15deg); } to { transform: rotate(-15deg); } } @keyframes rightLeg { from { transform: rotate(-15deg); } to { transform: rotate(15deg); } } .name { margin-top: 45px; font-size: 32px; font-weight: bold; color: #67e8f9; text-shadow: 0 0 15px #22d3ee; } .message { margin-top: 10px; font-size: 17px; opacity: 0.85; } </style> </head> <body> <div class="stars"></div> <div class="container"> <div class="robot"> <div class="head"> <div class="eye left"></div> <div class="eye right"></div> </div> <div class="body"></div> <div class="arm left"></div> <div class="arm right"></div> <div class="leg left"></div> <div class="leg right"></div> </div> <div class="name"> ГАП ЗАН 🤖 </div> <div class="message"> Я робот, который умеет танцевать! 💃✨ </div> </div>
 </body> 
</html>
